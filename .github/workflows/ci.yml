name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: cd client && npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: cd client && npm run lint
      - run: cd client && npm run format:check

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate --schema=src/database/prisma/schema.prisma
      - run: npm run test -- --reporter=verbose

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: cd client && npm ci
      - run: cd client && npm run test -- --reporter=verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-format, backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: cd client && npm ci

      - run: npx prisma generate --schema=src/database/prisma/schema.prisma
      - run: npm run build
      - run: cd client && npm run build
